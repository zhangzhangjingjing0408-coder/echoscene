[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "echoscene-backend"
version = "0.15.0"
description = "EchoScene API, training controller, and evaluation harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
  "youtube-transcript-api>=1.2,<2"
]

[project.optional-dependencies]
agent = [
  "livekit-api>=1.0,<2",
  "livekit-agents~=1.5",
  "livekit-plugins-deepgram~=1.5",
  "livekit-plugins-cartesia~=1.5"
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1"
]

[tool.setuptools.packages.find]
where = ["apps/api", "apps/agent", "packages/python"]
include = ["echoscene_api*", "echoscene_agent*", "echoscene_core*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/agent/tests", "packages/python/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
